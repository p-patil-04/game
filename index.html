<script type="text/javascript">
        var gk_isXlsx = false;
        var gk_xlsxFileLookup = {};
        var gk_fileData = {};
        function loadFileData(filename) {
        if (gk_isXlsx && gk_xlsxFileLookup[filename]) {
            try {
                var workbook = XLSX.read(gk_fileData[filename], { type: 'base64' });
                var firstSheetName = workbook.SheetNames[0];
                var worksheet = workbook.Sheets[firstSheetName];

                // Convert sheet to JSON to filter blank rows
                var jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1, blankrows: false, defval: '' });
                // Filter out blank rows (rows where all cells are empty, null, or undefined)
                var filteredData = jsonData.filter(row =>
                    row.some(cell => cell !== '' && cell !== null && cell !== undefined)
                );

                // Convert filtered JSON back to CSV
                var csv = XLSX.utils.aoa_to_sheet(filteredData); // Create a new sheet from filtered array of arrays
                csv = XLSX.utils.sheet_to_csv(csv, { header: 1 });
                return csv;
            } catch (e) {
                console.error(e);
                return "";
            }
        }
        return gk_fileData[filename] || "";
        }
        </script><!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #f0f0f0;
        }
        #game-container {
            text-align: center;
        }
        #board {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            grid-gap: 5px;
            margin: 20px auto;
        }
        .cell {
            width: 100px;
            height: 100px;
            background: #fff;
            border: 2px solid #333;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            cursor: pointer;
            transition: background 0.3s;
        }
        .cell:hover {
            background: #e0e0e0;
        }
        #status {
            font-size: 24px;
            margin: 20px 0;
        }
        #restart, #undo, #mode-toggle {
            padding: 10px 20px;
            font-size: 16px;
            margin: 5px;
            cursor: pointer;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            transition: background 0.3s;
        }
        #restart:hover, #undo:hover, #mode-toggle:hover {
            background-color: #45a049;
        }
        #scoreboard {
            font-size: 18px;
            margin: 10px 0;
        }
        .disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <h1>Tic Tac Toe</h1>
        <div id="scoreboard">X: 0 | O: 0 | Ties: 0</div>
        <div id="status">Player X's turn</div>
        <div id="board"></div>
        <button id="restart">Restart Game</button>
        <button id="undo" disabled>Undo Move</button>
        <button id="mode-toggle">Switch to AI Mode</button>
    </div>

    <script>
        const board = document.getElementById('board');
        const status = document.getElementById('status');
        const restartBtn = document.getElementById('restart');
        const undoBtn = document.getElementById('undo');
        const modeToggleBtn = document.getElementById('mode-toggle');
        const scoreboard = document.getElementById('scoreboard');

        let gameBoard = ['', '', '', '', '', '', '', '', ''];
        let currentPlayer = 'X';
        let gameActive = true;
        let moveHistory = [];
        let scores = { X: 0, O: 0, Ties: 0 };
        let isAIMode = false;

        const winningCombinations = [
            [0, 1, 2], [3, 4, 5], [6, 7, 8],
            [0, 3, 6], [1, 4, 7], [2, 5, 8],
            [0, 4, 8], [2, 4, 6]
        ];

        function createBoard() {
            board.innerHTML = '';
            gameBoard.forEach((_, index) => {
                const cell = document.createElement('div');
                cell.classList.add('cell');
                cell.dataset.index = index;
                cell.addEventListener('click', () => handleCellClick(index));
                board.appendChild(cell);
            });
        }

        function handleCellClick(index) {
            if (gameBoard[index] !== '' || !gameActive) return;

            gameBoard[index] = currentPlayer;
            moveHistory.push(index);
            undoBtn.disabled = false;
            updateBoard();
            checkGameStatus();

            if (isAIMode && gameActive && currentPlayer === 'O') {
                setTimeout(makeAIMove, 500);
            }
        }

        function updateBoard() {
            document.querySelectorAll('.cell').forEach((cell, index) => {
                cell.textContent = gameBoard[index];
                cell.style.color = gameBoard[index] === 'X' ? '#e74c3c' : '#3498db';
            });
        }

        function checkGameStatus() {
            for (let combo of winningCombinations) {
                const [a, b, c] = combo;
                if (gameBoard[a] && gameBoard[a] === gameBoard[b] && gameBoard[a] === gameBoard[c]) {
                    status.textContent = `Player ${gameBoard[a]} wins!`;
                    scores[gameBoard[a]]++;
                    gameActive = false;
                    updateScoreboard();
                    return;
                }
            }

            if (!gameBoard.includes('')) {
                status.textContent = "It's a tie!";
                scores.Ties++;
                gameActive = false;
                updateScoreboard();
                return;
            }

            currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
            status.textContent = `Player ${currentPlayer}'s turn`;
        }

        function updateScoreboard() {
            scoreboard.textContent = `X: ${scores.X} | O: ${scores.O} | Ties: ${scores.Ties}`;
        }

        function restartGame() {
            gameBoard = ['', '', '', '', '', '', '', '', ''];
            currentPlayer = 'X';
            gameActive = true;
            moveHistory = [];
            undoBtn.disabled = true;
            status.textContent = `Player ${currentPlayer}'s turn`;
            createBoard();
        }

        function undoMove() {
            if (moveHistory.length === 0) return;
            const lastMove = moveHistory.pop();
            gameBoard[lastMove] = '';
            currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
            gameActive = true;
            status.textContent = `Player ${currentPlayer}'s turn`;
            undoBtn.disabled = moveHistory.length === 0;
            updateBoard();
        }

        function toggleMode() {
            isAIMode = !isAIMode;
            modeToggleBtn.textContent = isAIMode ? 'Switch to Two-Player Mode' : 'Switch to AI Mode';
            restartGame();
        }

        function makeAIMove() {
            const bestMove = minimax(gameBoard, 'O').index;
            handleCellClick(bestMove);
        }

        function minimax(board, player) {
            const emptyCells = board.reduce((acc, val, idx) => val === '' ? [...acc, idx] : acc, []);

            for (let combo of winningCombinations) {
                const [a, b, c] = combo;
                if (board[a] && board[a] === board[b] && board[a] === board[c]) {
                    return { score: board[a] === 'O' ? 10 : -10 };
                }
            }

            if (emptyCells.length === 0) return { score: 0 };

            let moves = [];
            for (let index of emptyCells) {
                let move = {};
                board[index] = player;
                move.index = index;

                if (player === 'O') {
                    move.score = minimax(board, 'X').score;
                } else {
                    move.score = minimax(board, 'O').score;
                }

                board[index] = '';
                moves.push(move);
            }

            let bestMove;
            if (player === 'O') {
                let bestScore = -Infinity;
                for (let move of moves) {
                    if (move.score > bestScore) {
                        bestScore = move.score;
                        bestMove = move;
                    }
                }
            } else {
                let bestScore = Infinity;
                for (let move of moves) {
                    if (move.score < bestScore) {
                        bestScore = move.score;
                        bestMove = move;
                    }
                }
            }

            return bestMove;
        }

        createBoard();
        restartBtn.addEventListener('click', restartGame);
        undoBtn.addEventListener('click', undoMove);
        modeToggleBtn.addEventListener('click', toggleMode);
    </script>
</body>
</html>
